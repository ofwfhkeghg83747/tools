<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Алиса Пульт</title>
<style>
:root { --bg:#121212; --card:#1e1e1e; --accent:#ff9f0a; --sec:#b0b0b0; --border:#333; }
* { box-sizing: border-box; }
body { background:var(--bg); color:#fff; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; margin:0; padding:12px; padding-bottom:80px; }
header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
h1 { margin:0; font-size:1.15rem; }
.sub { font-size:.72rem; color:var(--sec); }
.badge { background:#2a2a2a; border:1px solid var(--accent); color:var(--accent); padding:6px 10px; border-radius:10px; font-size:.72rem; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:14px; }
.title { font-size:.72rem; letter-spacing:1px; text-transform:uppercase; color:var(--sec); margin-bottom:10px; }
.hint { font-size:.78rem; color:#777; margin-bottom:10px; }
button { background:#2a2a2a; border:1px solid var(--border); color:#fff; padding:12px; border-radius:12px; font-weight:600; font-size:.85rem; cursor:pointer; }
button:active { background:#3a3a3a; }
.btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btn-primary { background:var(--accent); color:#000; border:none; width:100%; padding:14px; margin-top:10px; }
select, input { width:100%; background:#2a2a2a; border:1px solid var(--border); color:#fff; padding:12px; border-radius:12px; font-size:.9rem; outline:none; }
input:focus, select:focus { border-color:var(--accent); }
.media { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.media button { font-size:1.1rem; padding:12px 0; }
.vol-row { display:flex; align-items:center; gap:10px; }
input[type=range] { -webkit-appearance:none; padding:0; border:none; background:transparent; }
input[type=range]::-webkit-slider-runnable-track { height:4px; background:#444; border-radius:2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--accent); margin-top:-9px; }
.chips { display:flex; gap:8px; margin-bottom:10px; }
.chip { flex:1; padding:9px 0; font-size:.72rem; }
.chip.on { background:var(--accent); color:#000; border-color:var(--accent); }
#log { font-size:.7rem; color:#555; padding:8px; min-height:20px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Алиса Пульт</h1>
    <div class="sub" id="sub">Не подключено</div>
  </div>
  <div class="badge" id="badge" onclick="logout()" style="display:none;">ВЫЙТИ</div>
</header>

<div class="card" id="loginCard">
  <div class="title">Вход</div>
  <div class="hint">Войди в аккаунт, где подключена Станция.</div>
  <button class="btn-primary" onclick="loginYandex()">ВОЙТИ ЧЕРЕЗ ЯНДЕКС</button>
</div>

<div id="pult" style="display:none;">

  <div class="card">
    <div class="title">Колонка для управления</div>
    <select id="deviceSelect" onchange="pickDevice()"><option value="">— пусто, нажми ОБНОВИТЬ —</option></select>
    <div class="btn-grid" style="margin-top:10px;">
      <button onclick="loadDevices()">ОБНОВИТЬ</button>
      <button onclick="cap('mute', true, 'devices.capabilities.toggle')">БЕЗ ЗВУКА</button>
    </div>
  </div>

  <div class="card">
    <div class="title">Мультимедиа</div>
    <div class="media">
      <button onclick="media('prev')">⏮</button>
      <button onclick="media('play')">▶</button>
      <button onclick="media('next')">⏭</button>
      <button onclick="media('stop')">⏹</button>
      <button onclick="media('like')">❤</button>
    </div>
  </div>

  <div class="card">
    <div class="title">Громкость <span id="vol-val" style="color:var(--accent)">—</span></div>
    <div class="vol-row">
      <input type="range" id="volume" min="0" max="10" value="0" oninput="setVol(this.value)">
    </div>
    <div class="btn-grid" style="grid-template-columns:repeat(5,1fr); margin-top:10px;">
      <button onclick="setVol(0)">0</button>
      <button onclick="setVol(3)">3</button>
      <button onclick="setVol(5)">5</button>
      <button onclick="setVol(7)">7</button>
      <button onclick="setVol(10)">10</button>
    </div>
  </div>

  <div class="card">
    <div class="title">Озвучить текст</div>
    <div class="chips">
      <button class="chip" id="v_megaphone" onclick="setVoice('megaphone')">МЕГАФОН</button>
      <button class="chip" id="v_robot" onclick="setVoice('robot')">РОБОТ</button>
      <button class="chip on" id="v_chipmunk" onclick="setVoice('chipmunk')">БУРУНДУК</button>
    </div>
    <input type="text" id="text-in" placeholder="— пусто, напиши текст —">
    <button class="btn-primary" onclick="sayText()">ОЗВУЧИТЬ НА КОЛОНКЕ</button>
  </div>

  <div id="log"></div>
</div>

<script>
const CLIENT_ID = 'f348d69eaf554cf4982643039e9c8cd4';
const REDIRECT_URI = 'https://ofwfhkeghg83747.github.io/tools/';
const API = "https://api.iot.yandex.net/v1.0";

let token = localStorage.getItem("ya_token") || "";
let devices = [];
let currentId = null;
let voice = "chipmunk";

(function catchToken(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token")) {
    token = h.get("access_token");
    localStorage.setItem("ya_token", token);
    history.replaceState(null,"",location.pathname);
  }
})();

function loginYandex(){
  location.href = "https://oauth.yandex.ru/authorize?response_type=token&client_id=" + CLIENT_ID
    + "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) + "&force_confirm=yes";
}
function logout(){ localStorage.removeItem("ya_token"); location.reload(); }
function log(m){ document.getElementById("log").textContent = "> " + m; }

function enter(){
  if (!token) return;
  document.getElementById("loginCard").style.display = "none";
  document.getElementById("pult").style.display = "block";
  document.getElementById("sub").textContent = "Подключено";
  document.getElementById("badge").style.display = "block";
  loadDevices();
}

async function loadDevices(){
  log("Загрузка устройств...");
  try {
    const r = await fetch(API + "/user/devices", { headers: { "Authorization": "Bearer " + token } });
    if (r.status === 401) { log("Токен неверен — нажми ВЫЙТИ и войди заново"); return; }
    const d = await r.json();
    devices = d.devices || [];
    const sel = document.getElementById("deviceSelect");
    sel.innerHTML = '<option value="">— пусто, выбери —</option>';
    let speakers = 0;
    devices.forEach(dev => {
      const o = document.createElement("option");
      o.value = dev.id;
      o.textContent = dev.name;
      sel.appendChild(o);
      if (dev.type === "devices.types.speaker") speakers++;
    });
    log("Устройств: " + devices.length + ", колонок: " + speakers);
  } catch(e) {
    log("Ошибка: " + e.message);
  }
}

function pickDevice(){
  currentId = document.getElementById("deviceSelect").value;
  if (currentId) log("Выбрано: " + document.getElementById("deviceSelect").selectedOptions[0].textContent);
}

function cap(instance, value, type){
  if (!currentId) { log("Сначала выбери колонку"); return; }
  fetch(API + "/devices/" + currentId + "/actions", {
    method:"POST",
    headers:{ "Authorization":"Bearer " + token, "Content-Type":"application/json" },
    body: JSON.stringify({ capabilities:[{ type:type, state:{ instance:instance, value:value } }] })
  }).then(r => r.json()).then(d => {
    log(d.status === "ok" ? "Готово" : "Ошибка: " + JSON.stringify(d).slice(0,120));
  }).catch(e => log("Ошибка: " + e.message));
}

function setVol(v){
  document.getElementById("vol-val").textContent = v + " / 10";
  cap("volume", Number(v), "devices.capabilities.range");
}
function media(a){ cap("media_" + a, true, "devices.capabilities.custom.button"); }

function sayText(){
  const t = document.getElementById("text-in").value.trim();
  if (!t) { log("Поле пустое — напиши текст"); return; }
  cap("text_action", t, "devices.capabilities.quasar_server_action");
}

function setVoice(v){
  voice = v;
  ["megaphone","robot","chipmunk"].forEach(k => document.getElementById("v_" + k).classList.remove("on"));
  document.getElementById("v_" + v).classList.add("on");
}

enter();
</script>
</body>
</html>
