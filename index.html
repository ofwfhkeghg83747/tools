<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Алиса Пульт</title>
<style>
:root { --bg:#121212; --card:#1e1e1e; --accent:#ff9f0a; --sec:#b0b0b0; --border:#333; }
* { box-sizing:border-box; }
body { background:var(--bg); color:#fff; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; margin:0; padding:12px; }
header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
h1 { margin:0; font-size:1.15rem; }
.sub { font-size:.72rem; color:var(--sec); }
.badge { background:#2a2a2a; border:1px solid var(--accent); color:var(--accent); padding:6px 10px; border-radius:10px; font-size:.72rem; cursor:pointer; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:14px; }
.title { font-size:.72rem; letter-spacing:1px; text-transform:uppercase; color:var(--sec); margin-bottom:10px; }
.hint { font-size:.78rem; color:#777; margin-bottom:10px; }
button { background:#2a2a2a; border:1px solid var(--border); color:#fff; padding:12px; border-radius:12px; font-weight:600; font-size:.85rem; cursor:pointer; width:100%; }
button:active { background:#3a3a3a; }
.btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btn-primary { background:var(--accent); color:#000; border:none; width:100%; padding:14px; margin-top:10px; font-weight:700; }
select, input[type=text] { width:100%; background:#2a2a2a; border:1px solid var(--border); color:#fff; padding:12px; border-radius:12px; font-size:.9rem; outline:none; }
.media { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.media button { font-size:1.1rem; padding:12px 0; }
.vol-row { display:flex; align-items:center; gap:10px; }
.vol-num { font-weight:700; min-width:70px; text-align:center; color:var(--accent); }
input[type=range] { -webkit-appearance:none; width:100%; padding:0; border:none; background:transparent; }
input[type=range]::-webkit-slider-runnable-track { height:4px; background:#444; border-radius:2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--accent); margin-top:-9px; }
#log { font-size:.75rem; color:#9a9a9a; padding:8px; white-space:pre-wrap; }
.off { display:none; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Алиса Пульт</h1>
    <div class="sub" id="sub">Не подключено</div>
  </div>
  <div class="badge off" id="badge" onclick="logout()">ВЫЙТИ</div>
</header>

<div class="card" id="loginCard">
  <div class="title">Вход</div>
  <div class="hint">Войди в аккаунт, к которому привязана Станция.</div>
  <button class="btn-primary" onclick="loginYandex()">ВОЙТИ ЧЕРЕЗ ЯНДЕКС</button>
</div>

<div id="pult" class="off">
  <div class="card">
    <div class="title">Устройство</div>
    <select id="deviceSelect" onchange="pickDevice()"><option value="">— выбери —</option></select>
    <div class="hint" id="devInfo" style="margin-top:8px; margin-bottom:0;"></div>
  </div>

  <div class="card off" id="cardVol">
    <div class="title">Громкость</div>
    <div class="vol-row">
      <input type="range" id="volume" onchange="setVol(this.value)">
      <div class="vol-num" id="vol-val">—</div>
    </div>
    <div class="btn-grid" style="margin-top:10px;">
      <button onclick="cap('devices.capabilities.toggle','mute',true)">🔇 Без звука</button>
      <button onclick="cap('devices.capabilities.toggle','mute',false)">🔊 Со звуком</button>
    </div>
  </div>

  <div class="card off" id="cardMedia">
    <div class="title">Музыка</div>
    <div class="media">
      <button onclick="media('prev')">⏮</button>
      <button id="mPlay" onclick="mediaPlay()">▶</button>
      <button onclick="media('next')">⏭</button>
      <button onclick="media('stop')">⏹</button>
    </div>
  </div>

  <div class="card off" id="cardText">
    <div class="title">Сказать на колонке</div>
    <input type="text" id="text-in" placeholder="Напиши текст">
    <button class="btn-primary" onclick="sayText()">ОЗВУЧИТЬ</button>
  </div>

  <div class="card off" id="cardOnOff">
    <div class="title">Питание</div>
    <div class="btn-grid">
      <button onclick="cap('devices.capabilities.on_off','on',true)">ВКЛ</button>
      <button onclick="cap('devices.capabilities.on_off','on',false)">ВЫКЛ</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="title">Журнал</div>
  <div id="log">Ожидание...</div>
</div>

<script>
// ================= НАСТРОЙКИ =================
// ВСТАВЬ СЮДА СВОЙ CLIENT_ID С oauth.yandex.ru
const CLIENT_ID = 'YOUR_CLIENT_ID'; 

// Адрес должен ТОЧНО совпадать с Redirect URI в настройках приложения на Яндексе
const REDIRECT_URI = 'https://eghg83747.github.io/'; 

// ВСТАВЬ СЮДА ССЫЛКУ НА ТВОЙ WORKER (Cloudflare)
// Пример: https://my-proxy.eghg83747.workers.dev
const API = 'YOUR_WORKER_URL'; 

let token = localStorage.getItem('ya_token') || '';
let devices = ;
let currentId = null;
let playing = false;

function log(msg) {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    el.textContent = `[${time}] ${msg}\n` + el.textContent;
    console.log(`[LOG] \${msg}`);
}

// Обработка токена из адресной строки
if (location.hash.includes('access_token')) {
  log('Обнаружен токен в адресной строке. Обработка...');
  try {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.get('access_token')) {
      token = p.get('access_token');
      localStorage.setItem('ya_token', token);
      history.replaceState(null, '', location.pathname); 
      log('Токен сохранен. Перезагрузка страницы...');
      location.reload();
    } else if (p.get('error')) {
      log('Ошибка авторизации: ' + (p.get('error_description') || p.get('error')));
    }
  } catch (e) {
    log('Ошибка парсинга токена: ' + e.message);
  }
}

function loginYandex() {
  const scope = 'login:info%20iot:view%20iot:control';
  const authUrl = `https://oauth.yandex.ru/authorize?response_type=token&client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=\${scope}&force_confirm=yes`;
  log('Переход на страницу входа...');
  location.href = authUrl;
}

function logout() { 
    localStorage.removeItem('ya_token'); 
    token = '';
    log('Выход выполнен. Токен удален.');
    location.reload(); 
}

async function api(path, opts) {
  if (!token) throw new Error('Нет токена авторизации');
  
  try {
    // Формируем полный URL. Воркер сам добавит путь к API Яндекса
    const fullUrl = API + path;
    
    const r = await fetch(fullUrl, Object.assign({
      headers: { 'Authorization': 'Bearer ' + token }
    }, opts || {}));
    
    if (r.status === 401) { 
        log('Ошибка 401: Токен невалиден. Требуется повторный вход.');
        throw new Error('401'); 
    }
    if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        throw new Error(`HTTP ${r.status}: ${err.message || 'Ошибка сети'}`);
    }
    return await r.json();
  } catch (e) {
    log('Сетевая ошибка: ' + e.message);
    throw e;
  }
}

function enter() {
  if (!token) return;
  document.getElementById('loginCard').classList.add('off');
  document.getElementById('pult').classList.remove('off');
  document.getElementById('badge').classList.remove('off');
  document.getElementById('sub').textContent = 'Подключено';
  loadHome();
}

function collectDevices(node, out) {
  if (Array.isArray(node)) { node.forEach(n => collectDevices(n, out)); return; }
  if (node && typeof node === 'object') {
    if (node.id && Array.isArray(node.capabilities)) out.push(node);
    Object.values(node).forEach(v => { if (v && typeof v === 'object') collectDevices(v, out); });
  }
}

async function loadHome() {
  log('Загрузка списка устройств...');
  try {
    const d = await api('/user/info');
    devices = ;
    collectDevices(d.houses || , devices);
    
    const sel = document.getElementById('deviceSelect');
    sel.innerHTML = '<option value="">— выбери —</option>';
    
    if (devices.length === 0) {
        log('Устройства не найдены. Проверь, что колонка добавлена в "Дом с Алисой".');
        return;
    }

    devices.forEach(dev => {
      const o = document.createElement('option');
      o.value = dev.id;
      o.textContent = (dev.room || 'Без комнаты') + ' · ' + dev.name;
      sel.appendChild(o);
    });
    log(`Найдено устройств: \${devices.length}. Выбери своё в списке.`);
  } catch (e) {
    log('Ошибка загрузки устройств: ' + e.message);
  }
}

async function pickDevice() {
  currentId = document.getElementById('deviceSelect').value;
  ['cardVol','cardMedia','cardText','cardOnOff'].forEach(i => document.getElementById(i).classList.add('off'));
  
  if (!currentId) return;
  
  const name = document.getElementById('deviceSelect').selectedOptions.textContent;
  document.getElementById('devInfo').textContent = 'Выбрано: ' + name;
  
  try {
    const d = await api('/devices/' + currentId);
    const caps = d.capabilities || ;
    const get = t => caps.find(c => c.type === t);

    const vol = caps.find(c => c.type === 'devices.capabilities.range' && c.state && c.state.instance === 'volume');
    if (vol) {
      const rng = (vol.parameters && vol.parameters.range) || { min: 0, max: 100 };
      const s = document.getElementById('volume');
      s.min = rng.min; s.max = rng.max; s.value = vol.state.value;
      document.getElementById('vol-val').textContent = vol.state.value + ' из ' + rng.max;
      document.getElementById('cardVol').classList.remove('off');
    }
    
    const mp = get('devices.capabilities.media_player');
    if (mp) {
      playing = mp.state && mp.state.instance === 'playback' && mp.state.value === 'play';
      document.getElementById('mPlay').textContent = playing ? '⏸' : '▶';
      document.getElementById('cardMedia').classList.remove('off');
    }
    
    if (get('devices.capabilities.quasar.server_action')) document.getElementById('cardText').classList.remove('off');
    if (get('devices.capabilities.on_off')) document.getElementById('cardOnOff').classList.remove('off');
  } catch (e) { 
    log('Ошибка получения данных устройства: ' + e.message); 
  }
}

async function cap(type, instance, value) {
  if (!currentId) { log('Сначала выбери устройство в списке!'); return; }
  log(`Отправка команды: ${type} -> ${instance} = \${value}`);
  try {
    const r = await fetch(API + '/devices/actions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ devices: [{ id: currentId, actions: [{ type: type, state: { instance: instance, value: value } }] }] })
    });
    const d = await r.json();
    const res = d.devices && d.devices && d.devices.capabilities;
    const st = res && res && res.state && res.state.action_result && res.state.action_result.status;
    
    if (st === 'DONE') {
        log('Команда выполнена успешно!');
    } else {
        log('Ответ сервера: ' + JSON.stringify(d).slice(0, 150));
    }
  } catch (e) { 
    log('Ошибка отправки команды: ' + e.message); 
  }
}

function setVol(v) {
  document.getElementById('vol-val').textContent = v;
  cap('devices.capabilities.range', 'volume', Number(v));
}
function media(a) { cap('devices.capabilities.media_player', 'playback', a); }
function mediaPlay() { 
    media(playing ? 'pause' : 'play'); 
    playing = !playing; 
    document.getElementById('mPlay').textContent = playing ? '⏸' : '▶'; 
}

async function sayText() {
  const t = document.getElementById('text-in').value.trim();
  if (!t) { log('Поле текста пустое'); return; }
  if (t.length > 100) { log('Текст слишком длинный (макс 100 символов)'); return; }
  cap('devices.capabilities.quasar.server_action', 'text_action', t);
}

enter();
</script>
</body>
</html>
