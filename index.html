<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Космический пульт</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    :root {
      --primary: #00d2ff;
      --panel: rgba(10, 10, 30, 0.85);
      --metal: #2c3e50;
      --accent: #ff4757;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #050510 0%, #000000 100%);
      color: white;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
      min-height: 100vh;
    }

    /* Звёзды */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle infinite alternate;
    }
    .star-small { width: 1px; height: 1px; }
    .star-med { width: 2px; height: 2px; }
    .star-large { width: 3px; height: 3px; }

    @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 1; } }

    /* Панель */
    .panel {
      position: relative;
      width: 90%;
      max-width: 500px;
      margin: 40px auto;
      background: var(--panel);
      border: 1px solid var(--primary);
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
      padding: 20px;
      backdrop-filter: blur(5px);
    }

    h1 {
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--primary);
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
    input[type="password"] {
      width: 100%;
      padding: 12px;
      background: rgba(0,0,0,0.5);
      border: 1px solid #444;
      color: var(--primary);
      font-family: monospace;
      box-sizing: border-box;
      outline: none;
    }
    input:focus { border-color: var(--primary); }

    /* Сетка кнопок */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      padding: 16px;
      border: none;
      cursor: pointer;
      font-family: 'Orbitron';
      font-weight: 700;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn-main {
      background: linear-gradient(135deg, #34495e, #2c3e50);
      color: white;
      border: 1px solid #555;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    }
    .btn-main:hover {
      background: linear-gradient(135deg, #4a6b82, #34495e);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
    .btn-main:active { transform: translateY(0); }

    .btn-primary {
      grid-column: span 2;
      background: linear-gradient(to bottom, #ff7675, #d63031);
      color: white;
      border: 1px solid #c0392b;
      box-shadow: 0 5px 15px rgba(214, 48, 49, 0.4);
      text-transform: uppercase;
    }
    .btn-primary:hover {
      background: linear-gradient(to bottom, #e55039, #c0392b);
      transform: scale(1.02);
    }

    #status {
      margin-top: 20px;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
      text-shadow: 0 0 5px black;
    }
    .status-error { background: rgba(214, 48, 49, 0.3); color: #ff7675; border: 1px solid #d63031; }
    .status-success { background: rgba(46, 204, 113, 0.3); color: #2ecc71; border: 1px solid #2ecc71; }
    .status-info { background: rgba(52, 152, 219, 0.3); color: #3498db; border: 1px solid #3498db; }
  </style>
</head>
<body>

  <!-- Рисуем звёзды -->
  <script>
    const count = 150;
    for (let i = 0; i < count; i++) {
      const star = document.createElement('div');
      const size = Math.random() * 3 + 1;
      const x = Math.random() * 100;
      const y = Math.random() * 100;
      star.className = 'star star-small';
      if (size > 2) star.className += ' star-med';
      if (size > 2.5) star.className += ' star-large';
      star.style.left = x + '%';
      star.style.top = y + '%';
      star.style.animationDuration = (Math.random() * 4 + 2) + 's';
      document.body.appendChild(star);
    }
  </script>

  <div class="panel">
    <h1>Space Control</h1>

    <div class="input-group">
      <label for="tok">Авторизация (токен y0_...)</label>
      <input type="password" id="tok" placeholder="Вставьте токен сюда">
    </div>

    <div class="btn-grid">
      <button class="btn-main" onclick="loadDevices()">📡 Сканировать устройства</button>
      <button class="btn-main" onclick="toggleMute()">🔇 Без звука</button>
      <button class="btn-main" onclick="setVolume(50)">🔊 Громкость 50%</button>
      <button class="btn-main" onclick="setVolume(100)">🔊 Громкость макс</button>
    </div>

    <button class="btn-primary" onclick="goPower()">⚡ ВКЛЮЧИТЬ / ВЫКЛЮЧИТЬ СВЕТ</button>

    <div id="status"></div>
  </div>

  <script>
    let token = '';
    let deviceId = null;

    function saveToken() {
      token = document.getElementById('tok').value.trim().replace(/[^\x00-\x7F]/g, '');
      if (!token.startsWith('y0_')) {
        showStatus('❌ Токен должен начинаться с y0_', 'error');
        return false;
      }
      showStatus('✅ Токен принят (не сохраняется!)', 'info');
      return true;
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.style.display = 'block';
      el.className = 'status ' + (type === 'error' ? 'status-error' : type === 'success' ? 'status-success' : 'status-info');
    }

    async function loadDevices() {
      if (!saveToken()) return;
      showStatus('🛸 Сканирование сети...', 'info');

      try {
        const r = await fetch('https://iot.yandex.net/api/v1.0/user/devices', {
          headers: { 'Authorization': 'OAuth ' + token }
        });

        if (r.status === 401) {
          showStatus('❌ Неверный токен. Обновите в кабинете разработчика.', 'error');
          return;
        }
        if (r.status === 403) {
          showStatus('⚠️ Яндекс блокирует запрос из браузера (CORS). Это не ошибка кода.', 'error');
          return;
        }

        const d = await r.json();
        if (!d.devices || d.devices.length === 0) {
          showStatus('🌌 Устройств не найдено. Проверьте права приложения.', 'info');
          return;
        }

        // Для примера берём первое устройство с capability on_off
        const onOffDevice = d.devices.find(dev =>
          dev.capabilities && dev.capabilities.some(c => c.type === 'devices.capabilities.on_off')
        );
        if (onOffDevice) {
          deviceId = onOffDevice.id;
          showStatus(`✅ Выбрано устройство: ${onOffDevice.name}`, 'success');
        } else {
          showStatus('⚠️ Нет устройств с включением/выключением.', 'info');
        }
      } catch (e) {
        console.error(e);
        showStatus('💥 Ошибка сети. Скорее всего, браузер блокирует запрос к Яндексу.', 'error');
      }
    }

    async function sendAction(payload) {
      if (!deviceId) {
        showStatus('⚠️ Сначала нажмите «Сканировать устройства» и дождитесь успеха.', 'error');
        return;
      }
      if (!saveToken()) return;

      showStatus('🚀 Отправка команды...', 'info');
      try {
        const r = await fetch('https://iot.yandex.net/api/v1.0/devices/actions', {
          method: 'POST',
          headers: {
            'Authorization': 'OAuth ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (r.ok) {
          showStatus('✅ Команда отправлена!', 'success');
        } else if (r.status === 401) {
          showStatus('❌ Истек токен. Нужен новый.', 'error');
        } else {
          const err = await r.json().catch(() => ({}));
          showStatus('⚠️ Ошибка выполнения: ' + (err.message || r.status), 'error');
        }
      } catch (e) {
        showStatus('💥 Ошибка соединения', 'error');
      }
    }

    function goPower() {
      // В реальном пульте нужно сначала узнать текущее состояние.
      // Здесь для простоты — отправляем "включить".
      const payload = {
        devices: [{
          id: deviceId,
          capabilities: [{
            type: 'devices.capabilities.on_off',
            state: { instance: 'on', value: true }
          }]
        }]
      };
      sendAction(payload);
    }

    function toggleMute() {
      const payload = {
        devices: [{
          id: deviceId,
          capabilities: [{
            type: 'devices.capabilities.toggle',
            state: { instance: 'mute', value: true }
          }]
        }]
      };
      sendAction(payload);
    }

    function setVolume(val) {
      const payload = {
        devices: [{
          id: deviceId,
          capabilities: [{
            type: 'devices.capabilities.range',
            state: { instance: 'volume', value: val }
          }]
        }]
      };
      sendAction(payload);
    }
  </script>
</body>
</html>
