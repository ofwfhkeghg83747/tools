<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>СЕРВЕР</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #0f0;
    font-family: "Courier New", monospace;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  h1 { font-size: 28px; margin: 0 0 20px; letter-spacing: 2px; }
  #timer {
    font-size: 64px; font-weight: bold; color: #f33;
    text-shadow: 0 0 20px #f00;
    margin-bottom: 30px;
  }
  #barBox {
    width: 70%; max-width: 700px; height: 30px;
    border: 2px solid #0f0;
    box-shadow: 0 0 20px #0f0 inset, 0 0 10px #0f0;
    position: relative; overflow: hidden;
  }
  #bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #0f0, #ff0, #f00);
    transition: width 1s linear;
  }
  #status {
    margin-top: 25px; font-size: 18px; color: #ff0;
    min-height: 30px;
    text-shadow: 0 0 8px #ff0;
  }
  #warning {
    position: fixed; top: 0; left: 0; right: 0;
    background: #f00; color: #000; font-weight: bold;
    padding: 10px; font-size: 18px;
    text-align: center;
    display: none;
    animation: blink 0.6s infinite alternate;
    z-index: 999;
  }
  @keyframes blink { from{opacity:1} to{opacity:0.55} }

  .glitch { animation: glitch 0.15s infinite; }
  @keyframes glitch {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(-3px,2px); }
    50%  { transform: translate(3px,-2px); }
    75%  { transform: translate(-2px,-1px); }
    100% { transform: translate(2px,1px); }
  }

  #final {
    display: none;
    position: fixed; inset: 0;
    background: #000; color: #f00;
    flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    z-index: 1000;
    padding: 20px; box-sizing: border-box;
  }
  #final h2 { font-size: 42px; margin: 0 0 20px; letter-spacing: 4px; }
  #final p  { font-size: 20px; margin: 10px; color: #ff0; }
  #selfTimer { font-size: 72px; color: #f00; margin: 25px 0; text-shadow:0 0 25px #f00; }
  .sub { color: #0f0; font-size: 16px; }
</style>
</head>
<body>

<div id="warning">⚠ ВНИМАНИЕ: ОБНАРУЖЕНА ДЕКЛАССИФИКАЦИЯ СЕРВЕРА ⚠</div>

<div id="wrap">
  <h1>СЕРВЕР: ДЕКЛАССИФИКАЦИЯ</h1>
  <div id="timer">15:00</div>
  <div id="barBox"><div id="bar"></div></div>
  <div id="status">Установка соединения...</div>
</div>

<div id="final">
  <h2>САМОУНИЧТОЖЕНИЕ</h2>
  <p>ПРОТОКОЛ АКТИВИРОВАН</p>
  <div id="selfTimer">05:00</div>
  <p class="sub">Не отключайте питание</p>
  <p class="sub" id="finalStatus"></p>
</div>

<script>
/* ====================== НАСТРОЙКИ ====================== */
const TOTAL_MIN   = 15;   // сколько минут до «отключения сервера»
const SELF_MIN    = 5;    // сколько минут «самоуничтожение»
const LAG_EVERY   = 1000; // как часто подёргивать экран (мс)
/* ======================================================== */

const totalSec = TOTAL_MIN * 60;
const selfSec  = SELF_MIN  * 60;

const timerEl  = document.getElementById('timer');
const barEl    = document.getElementById('bar');
const statusEl = document.getElementById('status');
const warnEl   = document.getElementById('warning');
const wrapEl   = document.getElementById('wrap');
const finalEl  = document.getElementById('final');
const selfTEl  = document.getElementById('selfTimer');
const finalSt  = document.getElementById('finalStatus');

/* фаза 1: обратный отсчёт */
let left = totalSec;

/* Запускаем лаги и предупреждение почти сразу */
setTimeout(() => {
  warnEl.style.display = 'block';
  statusEl.textContent = 'ВНИМАНИЕ: сервер деклассифицируется';
}, 3000);

const lagInterval = setInterval(() => {
  // лёгкая тряска + мерцание
  wrapEl.classList.add('glitch');
  setTimeout(() => wrapEl.classList.remove('glitch'), 150);
}, LAG_EVERY);

function fmt(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function tick() {
  left--;
  if (left < 0) left = 0;

  timerEl.textContent = fmt(left);
  barEl.style.width = ((totalSec - left) / totalSec * 100) + '%';

  // предупреждение мигает всё быстрее к концу
  if (left <= 60) {
    warnEl.textContent = '⚠ КРИТИЧЕСКАЯ ДЕКЛАССИФИКАЦИЯ — ДО ОТКЛЮЧЕНИЯ МЕНЬШЕ МИНУТЫ ⚠';
  }
  if (left <= 10) {
    statusEl.textContent = 'СВЯЗЬ НЕСТАБИЛЬНА... ПАКЕТЫ ТЕРЯЮТСЯ...';
  }

  if (left <= 0) {
    clearInterval(lagInterval);
    startShutdown();
    return;
  }
}

const timerInterval = setInterval(tick, 1000);

/* фаза 2: сервер выключился */
function startShutdown() {
  barEl.style.width = '100%';
  timerEl.textContent = '00:00';
  wrapEl.classList.remove('glitch');

  // «нет соединения с сервером»
  warnEl.style.display = 'block';
  warnEl.style.background = '#000';
  warnEl.style.color = '#f00';
  warnEl.textContent = 'НЕТ СОЕДИНЕНИЯ С СЕРВЕРОМ';
  statusEl.textContent = '';
  wrapEl.innerHTML = '<h1 style="color:#f00">НЕТ СОЕДИНЕНИЯ С СЕРВЕРОМ</h1>';

  setTimeout(() => {
    // «ошибка 505»
    warnEl.textContent = 'ОШИБКА 505 — HTTP VERSION NOT SUPPORTED';
    wrapEl.innerHTML = '<h1 style="color:#f00">ОШИБКА 505</h1>' +
                       '<div id="status" style="color:#ff0;margin-top:20px">' +
                       'Сервер не поддерживает данную версию протокола...</div>';
  }, 4000);

  setTimeout(startSelfDestruct, 8000);
}

/* фаза 3: самоуничтожение ПК */
function startSelfDestruct() {
  wrapEl.style.display = 'none';
  warnEl.style.display = 'none';
  finalEl.style.display = 'flex';

  let s = selfSec;

  const si = setInterval(() => {
    s--;
    if (s < 0) s = 0;
    selfTEl.textContent = fmt(s);

    // «ускоряющееся» мигание и сообщения
    if (s <= 120) finalSt.textContent = 'УДАЛЕНИЕ СИСТЕМНЫХ ФАЙЛОВ...';
    if (s <= 60)  finalSt.textContent = 'ПЕРЕЗАПИСЬ СЕКТОРОВ ДИСКА...';
    if (s <= 30)  finalSt.textContent = 'ФИНАЛЬНАЯ ОЧИСТКА...';

    if (s <= 0) {
      clearInterval(si);
      finalSt.textContent = '';
      finalEl.innerHTML =
        '<h2 style="color:#fff">СИСТЕМА УНИЧТОЖЕНА</h2>' +
        '<p class="sub" style="margin-top:20px">ЭТО БЫЛО ТЕСТОВОЕ СООБЩЕНИЕ.</p>' +
        '<p class="sub">ВАШ КОМПЬЮТЕР В ПОЛНОМ ПОРЯДКЕ.</p>';
    }
  }, 1000);
}
</script>
</body>
</html>
