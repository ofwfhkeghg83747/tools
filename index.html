<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Детектор Движения</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  background: #0f0c29;
  color: #fff;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}

.topbar h1 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #ff416c;
}

.topbar-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #aaa;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #666;
  transition: background 0.3s;
}

.dot.active { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
.dot.alarm { background: #ff0033; box-shadow: 0 0 8px #ff0033; animation: blink 0.3s infinite; }

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.camera-wrap {
  flex: 1;
  position: relative;
  background: #000;
  overflow: hidden;
  min-height: 0;
}

.camera-wrap.alarm {
  animation: alarmBorder 0.4s infinite;
}

@keyframes alarmBorder {
  0%, 100% { box-shadow: inset 0 0 0 4px #ff0033; }
  50% { box-shadow: inset 0 0 0 4px #ff0033, inset 0 0 40px #ff0033; }
}

#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transform: scaleX(-1);
}

#overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  transform: scaleX(-1);
}

.alarm-banner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 28px;
  font-weight: 900;
  color: #ff0033;
  text-shadow: 0 0 20px #ff0033;
  background: rgba(0,0,0,0.85);
  padding: 14px 28px;
  border-radius: 14px;
  display: none;
  letter-spacing: 3px;
  border: 2px solid #ff0033;
  white-space: nowrap;
}

.alarm-banner.active {
  display: block;
  animation: bannerPulse 0.3s infinite;
}

@keyframes bannerPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.08); }
}

.motion-indicator {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0,0,0,0.7);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15);
}

.motion-bar {
  width: 60px;
  height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  overflow: hidden;
}

.motion-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #00ff88, #ffd200, #ff0033);
  width: 0%;
  transition: width 0.1s;
}

.bottom-panel {
  flex-shrink: 0;
  background: rgba(20,20,35,0.98);
  border-top: 1px solid rgba(255,255,255,0.1);
  overflow: hidden;
  transition: max-height 0.3s ease;
  max-height: 0;
}

.bottom-panel.open {
  max-height: 55vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.panel-toggle {
  width: 100%;
  padding: 12px;
  background: rgba(255,65,108,0.15);
  border: none;
  color: #ff416c;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 2px;
  cursor: pointer;
  text-transform: uppercase;
  flex-shrink: 0;
  border-top: 1px solid rgba(255,65,108,0.3);
}

.panel-content {
  padding: 12px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.section-title {
  font-size: 11px;
  text-transform: uppercase;
  color: #ff416c;
  letter-spacing: 2px;
  font-weight: 700;
  margin-top: 4px;
  border-bottom: 1px solid rgba(255,65,108,0.3);
  padding-bottom: 4px;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.control-group label {
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.value-badge {
  background: #ff416c;
  color: #fff;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
  min-width: 46px;
  text-align: center;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 28px;
  background: transparent;
  outline: none;
}

input[type="range"]::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.15);
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  cursor: pointer;
  box-shadow: 0 0 10px rgba(255,65,108,0.7);
  margin-top: -10px;
}

input[type="range"]::-moz-range-track {
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.15);
}

input[type="range"]::-moz-range-thumb {
  width: 26px;
  height: 26px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  cursor: pointer;
}

.switch-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-size: 14px;
}

.switch {
  position: relative;
  width: 50px;
  height: 28px;
  flex-shrink: 0;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider-sw {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: rgba(255,255,255,0.2);
  border-radius: 28px;
  transition: 0.3s;
}

.slider-sw::before {
  content: "";
  position: absolute;
  height: 22px;
  width: 22px;
  left: 3px;
  bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: 0.3s;
}

.switch input:checked + .slider-sw { background: #ff416c; }
.switch input:checked + .slider-sw::before { transform: translateX(22px); }

select {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  background: rgba(0,0,0,0.4);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
  font-size: 14px;
  cursor: pointer;
}

select option { background: #24243e; }

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.stat-box {
  background: rgba(0,0,0,0.3);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-box span { color: #888; }
.stat-box strong { color: #ffb347; font-size: 16px; }

.alert-log {
  background: rgba(0,0,0,0.4);
  border-radius: 8px;
  padding: 8px;
  max-height: 100px;
  overflow-y: auto;
  font-size: 11px;
  font-family: monospace;
  color: #ffb347;
  -webkit-overflow-scrolling: touch;
}

.alert-log div { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

.controls-bar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  border-top: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}

.btn {
  padding: 14px 8px;
  border: none;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: transform 0.1s, opacity 0.2s;
  touch-action: manipulation;
}

.btn:active { transform: scale(0.95); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-start { background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff; }
.btn-stop { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: #fff; }
.btn-test { background: linear-gradient(135deg, #f7971e, #ffd200); color: #000; }

.flash-overlay {
  position: fixed;
  inset: 0;
  background: #ff0033;
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
  transition: opacity 0.1s;
}

@media (min-width: 800px) {
  .camera-wrap { max-height: 60vh; }
  .bottom-panel.open { max-height: 40vh; }
}
</style>
</head>
<body>

<div class="topbar">
  <h1>ДЕТЕКТОР ДВИЖЕНИЯ</h1>
  <div class="topbar-status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Не активна</span>
  </div>
</div>

<div class="camera-wrap" id="cameraWrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div class="alarm-banner" id="alarmBanner">ДВИЖЕНИЕ</div>
  <div class="motion-indicator">
    <span id="motionScore">0%</span>
    <div class="motion-bar"><div class="motion-bar-fill" id="motionFill"></div></div>
  </div>
</div>

<div class="controls-bar">
  <button class="btn btn-start" id="btnStart">Старт</button>
  <button class="btn btn-stop" id="btnStop" disabled>Стоп</button>
  <button class="btn btn-test" id="btnTest">Тест</button>
</div>

<button class="panel-toggle" id="panelToggle">НАСТРОЙКИ</button>

<div class="bottom-panel" id="bottomPanel">
  <div class="panel-content">
    <div class="section-title">Статистика</div>
    <div class="stat-grid">
      <div class="stat-box"><span>Срабатываний</span><strong id="triggerCount">0</strong></div>
      <div class="stat-box"><span>Громкость</span><strong id="volDisplay">80%</strong></div>
    </div>

    <div class="section-title">Чувствительность</div>
    <div class="control-group">
      <label><span>Порог движения</span><span class="value-badge" id="sensitivityVal">15%</span></label>
      <input type="range" id="sensitivity" min="1" max="60" value="15">
    </div>

    <div class="control-group">
      <label><span>Громкость сирены</span><span class="value-badge" id="volVal">80%</span></label>
      <input type="range" id="volume" min="0" max="100" value="80">
    </div>

    <div class="control-group">
      <label><span>Задержка тишины</span><span class="value-badge" id="delayVal">2с</span></label>
      <input type="range" id="silenceDelay" min="0" max="10" value="2">
    </div>

    <div class="control-group">
      <label><span>Скорость реакции</span><span class="value-badge" id="fpsVal">30 fps</span></label>
      <input type="range" id="fpsLimit" min="5" max="60" value="30">
    </div>

    <div class="section-title">Тип сирены</div>
    <select id="alarmType">
      <option value="classic">Классическая сирена</option>
      <option value="police">Полицейская</option>
      <option value="ambulance">Скорая помощь</option>
      <option value="buzzer">Зуммер</option>
      <option value="scream">Крик</option>
      <option value="beep">Бип-бип</option>
    </select>

    <div class="section-title">Дополнительно</div>

    <div class="switch-row">
      <span>Показывать зоны движения</span>
      <label class="switch"><input type="checkbox" id="showZones" checked><span class="slider-sw"></span></label>
    </div>

    <div class="switch-row">
      <span>Звук при детекции</span>
      <label class="switch"><input type="checkbox" id="soundEnabled" checked><span class="slider-sw"></span></label>
    </div>

    <div class="switch-row">
      <span>Вспышка экрана</span>
      <label class="switch"><input type="checkbox" id="flashEnabled" checked><span class="slider-sw"></span></label>
    </div>

    <div class="switch-row">
      <span>Вибрация</span>
      <label class="switch"><input type="checkbox" id="vibrateEnabled" checked><span class="slider-sw"></span></label>
    </div>

    <div class="section-title">Журнал событий</div>
    <div class="alert-log" id="alertLog">
      <div>Ожидание запуска...</div>
    </div>
    <button class="btn btn-stop" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);" id="btnClearLog">Очистить журнал</button>
  </div>
</div>

<div class="flash-overlay" id="flashOverlay"></div>

<script>
'use strict';

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const cameraWrap = document.getElementById('cameraWrap');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const alarmBanner = document.getElementById('alarmBanner');
const motionScoreEl = document.getElementById('motionScore');
const motionFill = document.getElementById('motionFill');
const triggerCountEl = document.getElementById('triggerCount');
const alertLog = document.getElementById('alertLog');
const flashOverlay = document.getElementById('flashOverlay');

const btnStart = document.getElementById('btnStart');
const btnStop = document.getElementById('btnStop');
const btnTest = document.getElementById('btnTest');
const btnClearLog = document.getElementById('btnClearLog');
const panelToggle = document.getElementById('panelToggle');
const bottomPanel = document.getElementById('bottomPanel');

const sensitivityEl = document.getElementById('sensitivity');
const sensitivityVal = document.getElementById('sensitivityVal');
const volumeEl = document.getElementById('volume');
const volVal = document.getElementById('volVal');
const volDisplay = document.getElementById('volDisplay');
const silenceDelayEl = document.getElementById('silenceDelay');
const delayVal = document.getElementById('delayVal');
const fpsLimitEl = document.getElementById('fpsLimit');
const fpsVal = document.getElementById('fpsVal');
const alarmTypeEl = document.getElementById('alarmType');

const showZonesEl = document.getElementById('showZones');
const soundEnabledEl = document.getElementById('soundEnabled');
const flashEnabledEl = document.getElementById('flashEnabled');
const vibrateEnabledEl = document.getElementById('vibrateEnabled');

let stream = null;
let running = false;
let previousFrame = null;
let alarmActive = false;
let lastMotionTime = 0;
let triggerCount = 0;
let audioCtx = null;
let alarmOscillator = null;
let alarmGain = null;
let alarmInterval = null;
let lastFrameTime = 0;
let frameInterval = 1000 / 30;
let flashInterval = null;

panelToggle.addEventListener('click', () => {
  bottomPanel.classList.toggle('open');
  panelToggle.textContent = bottomPanel.classList.contains('open') ? 'СКРЫТЬ' : 'НАСТРОЙКИ';
});

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function startAlarmSound() {
  if (!soundEnabledEl.checked) return;
  initAudio();
  stopAlarmSound();

  alarmGain = audioCtx.createGain();
  alarmGain.gain.value = 0;
  alarmGain.connect(audioCtx.destination);

  alarmOscillator = audioCtx.createOscillator();
  alarmOscillator.type = 'sawtooth';
  alarmOscillator.connect(alarmGain);
  alarmOscillator.start();

  const vol = parseFloat(volumeEl.value) / 100;
  alarmGain.gain.setTargetAtTime(vol * 0.35, audioCtx.currentTime, 0.05);

  playSirenPattern();
}

function playSirenPattern() {
  if (alarmInterval) clearInterval(alarmInterval);
  const type = alarmTypeEl.value;
  const now = () => audioCtx.currentTime;

  switch (type) {
    case 'classic':
      alarmOscillator.type = 'sawtooth';
      alarmInterval = setInterval(() => {
        if (!alarmActive || !alarmOscillator) return;
        const t = now();
        alarmOscillator.frequency.setValueAtTime(600, t);
        alarmOscillator.frequency.linearRampToValueAtTime(1200, t + 0.4);
      }, 400);
      break;

    case 'police': {
      alarmOscillator.type = 'square';
      let hiLo = false;
      alarmInterval = setInterval(() => {
        if (!alarmActive || !alarmOscillator) return;
        alarmOscillator.frequency.setValueAtTime(hiLo ? 900 : 1400, now());
        hiLo = !hiLo;
      }, 300);
      break;
    }

    case 'ambulance':
      alarmOscillator.type = 'sine';
      alarmInterval = setInterval(() => {
        if (!alarmActive || !alarmOscillator) return;
        const t = now();
        alarmOscillator.frequency.setValueAtTime(1800, t);
        alarmOscillator.frequency.linearRampToValueAtTime(2200, t + 0.2);
        alarmOscillator.frequency.linearRampToValueAtTime(1800, t + 0.4);
      }, 500);
      break;

    case 'buzzer':
      alarmOscillator.type = 'square';
      alarmInterval = setInterval(() => {
        if (!alarmActive || !alarmOscillator) return;
        alarmOscillator.frequency.setValueAtTime(150, now());
      }, 100);
      break;

    case 'scream':
      alarmOscillator.type = 'sawtooth';
      alarmInterval = setInterval(() => {
        if (!alarmActive || !alarmOscillator) return;
        alarmOscillator.frequency.setValueAtTime(400 + Math.random() * 1600, now());
      }, 50);
      break;

    case 'beep': {
      alarmOscillator.type = 'sine';
      let beepOn = false;
      alarmInterval = setInterval(() => {
        if (!alarmActive || !alarmGain) return;
        beepOn = !beepOn;
        const vol = parseFloat(volumeEl.value) / 100;
        alarmGain.gain.setTargetAtTime(beepOn ? vol * 0.4 : 0.001, now(), 0.01);
      }, 150);
      break;
    }
  }
}

function stopAlarmSound() {
  if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
  if (alarmOscillator) {
    try { alarmOscillator.stop(); alarmOscillator.disconnect(); } catch (e) {}
    alarmOscillator = null;
  }
  if (alarmGain) {
    try { alarmGain.disconnect(); } catch (e) {}
    alarmGain = null;
  }
}

function startFlash() {
  if (!flashEnabledEl.checked) return;
  if (flashInterval) clearInterval(flashInterval);
  let on = false;
  flashInterval = setInterval(() => {
    if (!alarmActive) {
      flashOverlay.style.opacity = '0';
      clearInterval(flashInterval);
      flashInterval = null;
      return;
    }
    on = !on;
    flashOverlay.style.opacity = on ? '0.25' : '0';
  }, 250);
}

function triggerAlarm() {
  lastMotionTime = Date.now();
  if (alarmActive) return;

  alarmActive = true;
  triggerCount++;
  triggerCountEl.textContent = triggerCount;

  cameraWrap.classList.add('alarm');
  statusDot.classList.add('alarm');
  statusDot.classList.remove('active');
  statusText.textContent = 'ДВИЖЕНИЕ';
  alarmBanner.classList.add('active');

  startAlarmSound();
  startFlash();

  if (vibrateEnabledEl.checked && navigator.vibrate) {
    navigator.vibrate([200, 100, 200, 100, 200]);
  }

  logAlert('Движение. Срабатывание #' + triggerCount);
}

function clearAlarm() {
  if (!alarmActive) return;
  alarmActive = false;
  cameraWrap.classList.remove('alarm');
  statusDot.classList.remove('alarm');
  if (running) {
    statusDot.classList.add('active');
    statusText.textContent = 'Наблюдение';
  } else {
    statusText.textContent = 'Не активна';
  }
  alarmBanner.classList.remove('active');
  stopAlarmSound();
  flashOverlay.style.opacity = '0';
  if (flashInterval) { clearInterval(flashInterval); flashInterval = null; }
}

function logAlert(msg) {
  const time = new Date().toLocaleTimeString('ru-RU');
  const div = document.createElement('div');
  div.textContent = '[' + time + '] ' + msg;
  alertLog.prepend(div);
  while (alertLog.children.length > 30) {
    alertLog.removeChild(alertLog.lastChild);
  }
}

const smallCanvas = document.createElement('canvas');
const smallCtx = smallCanvas.getContext('2d', { willReadFrequently: true });
const GRID_W = 32;
const GRID_H = 24;
smallCanvas.width = GRID_W;
smallCanvas.height = GRID_H;

function processFrame() {
  if (!running) return;

  requestAnimationFrame(processFrame);

  if (!video.videoWidth) return;

  const now = performance.now();
  if (now - lastFrameTime < frameInterval) return;
  lastFrameTime = now;

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  if (overlay.width !== vw || overlay.height !== vh) {
    overlay.width = vw;
    overlay.height = vh;
  }

  smallCtx.drawImage(video, 0, 0, GRID_W, GRID_H);
  const frameData = smallCtx.getImageData(0, 0, GRID_W, GRID_H);
  const pixels = frameData.data;
  const threshold = parseFloat(sensitivityEl.value) * 2.55;

  ctx.clearRect(0, 0, overlay.width, overlay.height);

  if (previousFrame) {
    const prevPixels = previousFrame;
    let motionPixels = 0;
    const totalPixels = GRID_W * GRID_H;

    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        const i = (y * GRID_W + x) * 4;
        const dr = Math.abs(pixels[i] - prevPixels[i]);
        const dg = Math.abs(pixels[i + 1] - prevPixels[i + 1]);
        const db = Math.abs(pixels[i + 2] - prevPixels[i + 2]);
        const diff = (dr + dg + db) / 3;

        if (diff > threshold) {
          motionPixels++;
          if (showZonesEl.checked) {
            const px = (x / GRID_W) * vw;
            const py = (y / GRID_H) * vh;
            const pw = vw / GRID_W;
            const ph = vh / GRID_H;
            ctx.fillStyle = 'rgba(255, 0, 51, 0.4)';
            ctx.fillRect(px, py, pw, ph);
          }
        }
      }
    }

    const motionPercent = (motionPixels / totalPixels) * 100;
    motionScoreEl.textContent = motionPercent.toFixed(1) + '%';
    motionFill.style.width = Math.min(100, motionPercent * 3) + '%';

    if (motionPercent > 0.5) {
      triggerAlarm();
    }
  }

  previousFrame = new Uint8ClampedArray(pixels);

  if (alarmActive) {
    const silenceDelay = parseFloat(silenceDelayEl.value) * 1000;
    const timeSinceMotion = Date.now() - lastMotionTime;
    if (timeSinceMotion > silenceDelay + 500) {
      clearAlarm();
    }
  }
}

async function startCamera() {
  try {
    initAudio();
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    running = true;
    previousFrame = null;

    btnStart.disabled = true;
    btnStop.disabled = false;
    statusText.textContent = 'Наблюдение';
    statusDot.classList.add('active');

    logAlert('Камера запущена');

    frameInterval = 1000 / parseInt(fpsLimitEl.value);
    lastFrameTime = 0;
    requestAnimationFrame(processFrame);
  } catch (err) {
    logAlert('Ошибка камеры: ' + err.message);
    statusText.textContent = 'Ошибка';
    alert('Не удалось получить доступ к камере. Разрешите доступ в настройках браузера.');
  }
}

function stopCamera() {
  running = false;
  clearAlarm();
  stopAlarmSound();

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
  previousFrame = null;

  ctx.clearRect(0, 0, overlay.width, overlay.height);
  motionScoreEl.textContent = '0%';
  motionFill.style.width = '0%';

  btnStart.disabled = false;
  btnStop.disabled = true;
  statusText.textContent = 'Не активна';
  statusDot.classList.remove('active', 'alarm');

  logAlert('Камера остановлена');
}

sensitivityEl.addEventListener('input', () => {
  sensitivityVal.textContent = sensitivityEl.value + '%';
});

volumeEl.addEventListener('input', () => {
  volVal.textContent = volumeEl.value + '%';
  volDisplay.textContent = volumeEl.value + '%';
  if (alarmGain && alarmActive) {
    const vol = parseFloat(volumeEl.value) / 100;
    alarmGain.gain.setTargetAtTime(vol * 0.35, audioCtx.currentTime, 0.05);
  }
});

silenceDelayEl.addEventListener('input', () => {
  delayVal.textContent = silenceDelayEl.value + 'с';
});

fpsLimitEl.addEventListener('input', () => {
  const fps = parseInt(fpsLimitEl.value);
  fpsVal.textContent = fps + ' fps';
  frameInterval = 1000 / fps;
});

alarmTypeEl.addEventListener('change', () => {
  if (alarmActive) {
    stopAlarmSound();
    setTimeout(startAlarmSound, 100);
  }
});

btnStart.addEventListener('click', () => {
  initAudio();
  startCamera();
});

btnStop.addEventListener('click', stopCamera);

btnTest.addEventListener('click', () => {
  initAudio();
  triggerAlarm();
  setTimeout(clearAlarm, 3000);
  logAlert('Тест сирены (3 сек)');
});

btnClearLog.addEventListener('click', () => {
  alertLog.innerHTML = '<div>Журнал очищен</div>';
});

let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) {}
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) {
    requestWakeLock();
  }
});

logAlert('Готов к работе. Нажмите "Старт"');
</script>
</body>
